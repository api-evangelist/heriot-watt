apis:
  - aid: heriot-watt:research-output-service
    name: Heriot-Watt Research Output Service (ROS)
    description: >-
      The university's own institutional repository of theses and research outputs, running
      DSpace 8 on www.ros.hw.ac.uk — a host under Heriot-Watt's registrable domain with a
      matching PTR record, an open.access@hw.ac.uk administrative contact and Heriot-Watt's own
      Handle prefix 10399. Two machine-readable surfaces are live and require no credentials: an
      OAI-PMH 2.0 endpoint (Identify, ListMetadataFormats, ListSets and ListRecords all answer,
      with didl, mods, ore, mets, xoai and oai_dc metadata formats and community-level sets), and
      the DSpace REST/HAL API rooted at /server/api exposing communities, collections, items,
      bitstreams and the discover search index. The REST contract itself is DSpace's product
      contract, shipped identically by every DSpace 8 installation, so no OpenAPI is saved under
      this institution; the deployment, the data and the OAI-PMH conformance are Heriot-Watt's.
    humanURL: https://www.ros.hw.ac.uk/
    baseURL: https://www.ros.hw.ac.uk/server/api
    x-operator: institution
    x-platform: DSpace 8.1
    tags:
      - Research
      - Institutional Repository
      - Open Access
      - Theses
      - OAI-PMH
      - DSpace
    properties:
      - type: APIReference
        url: https://www.ros.hw.ac.uk/server/api
      - type: ResearchRepository
        url: https://www.ros.hw.ac.uk/
      - type: Documentation
        url: https://www.hw.ac.uk/about/professional-services/information-services/research-support/ros-theses-repository
  - aid: heriot-watt:identity-federation
    name: Heriot-Watt University Identity Provider (UK Access Management Federation)
    description: >-
      Heriot-Watt operates its own SAML 2.0 / Shibboleth identity provider and is a registered
      member of the UK Access Management Federation (registrationAuthority
      http://ukfederation.org.uk), which in turn exports to eduGAIN. Four entities carry
      OrganizationName "Heriot-Watt University": the IdP entityIDs
      https://shib1.hw.ac.uk/shibboleth, https://shibprod.hw.ac.uk/idp/shibboleth and
      https://shibdev.hw.ac.uk/idp/shibboleth (test), plus a service-provider entity
      https://courses.scholar.hw.ac.uk/shibboleth for the SCHOLAR Programme. Signed, per-entity
      SAML metadata is retrievable over the federation's MDQ interface; the shib1 IdP also serves
      its own metadata directly. This is a genuinely institution-operated, machine-readable
      surface, and the only Heriot-Watt one that is not a repository. Only shib1.hw.ac.uk
      resolves in public DNS today (137.195.101.235, Heriot-Watt's own allocation); the shibprod,
      shibdev and courses.scholar names are registered in federation metadata but return
      NXDOMAIN, so the federation registration is currently ahead of the deployment.
    humanURL: https://shib1.hw.ac.uk/shibboleth-idp/shibboleth
    baseURL: https://shib1.hw.ac.uk/
    x-operator: institution
    x-platform: Shibboleth Identity Provider
    tags:
      - Identity Federation
      - SAML
      - Shibboleth
      - Single Sign-On
      - eduGAIN
    properties:
      - type: Metadata
        url: https://shib1.hw.ac.uk/shibboleth-idp/shibboleth
      - type: IdentityFederation
        url: http://mdq.ukfederation.org.uk/entities/https%3A%2F%2Fshib1.hw.ac.uk%2Fshibboleth
      - type: Registry
        url: https://www.ukfederation.org.uk/
  - aid: heriot-watt:research-portal
    name: Heriot-Watt Research Portal (Elsevier Pure)
    description: >-
      Heriot-Watt's public research information portal — publications, projects, research data,
      activities and researcher profiles. It carries a hw.ac.uk hostname but is not
      institution-operated infrastructure: researchportal.hw.ac.uk is a CNAME to
      hwu.elsevierpure.com and on to eu.prod.elsevierpure.com, an Elsevier-hosted Pure tenancy.
      The data, the DOIs (prefix 10.17861, registered through DataCite client BL.HWU) and the
      landing pages are Heriot-Watt's; the contract is Elsevier's. Pure's OAI-PMH and REST
      platform features are not open here — /ws/oai and /admin/oai return HTTP 500 with a
      {"status":999} body, /ws/api and /ws/rest return 404, and /en/organisations/ is
      bot-challenged with 403 — so nothing programmatic is publicly reachable without an
      institutional arrangement. No Pure specification is saved under this institution.
    humanURL: https://researchportal.hw.ac.uk/
    baseURL: https://researchportal.hw.ac.uk/
    x-operator: tenant
    x-platform: Elsevier Pure
    x-vendor-host: hwu.elsevierpure.com
    tags:
      - Research
      - Repository
      - Pure
      - Open Access
      - Publications
    properties:
      - type: Documentation
        url: https://www.hw.ac.uk/research-enterprise/research/research-environment/research-portal
      - type: ResearchRepository
        url: https://researchportal.hw.ac.uk/
  - aid: heriot-watt:library-discovery
    name: Heriot-Watt Library Discovery (Ex Libris Primo)
    description: >-
      Library discovery and catalog search for Heriot-Watt's Edinburgh, Scottish Borders, Orkney,
      Dubai and Malaysia libraries, running Ex Libris Primo under the institution's view code
      44HWA_V1 at discovery.hw.ac.uk. The host sits on Ex Libris infrastructure
      (31.186.254.152) and serves a Primo single-page application; any programmatic access is
      through Ex Libris Alma/Primo APIs on developers.exlibrisgroup.com, which is a generic
      vendor surface shared by every Ex Libris customer and is therefore not recorded under this
      institution. Recorded here as a tenant relationship only.
    humanURL: https://discovery.hw.ac.uk/primo-explore/search?vid=44HWA_V1
    x-operator: tenant
    x-platform: Ex Libris Primo
    tags:
      - Library
      - Discovery
      - Catalog
      - Primo
      - Ex Libris
    properties:
      - type: LibraryCatalog
        url: https://discovery.hw.ac.uk/primo-explore/search?vid=44HWA_V1
      - type: Documentation
        url: https://www.hw.ac.uk/about/professional-services/information-services/find-resources
  - aid: heriot-watt:canvas
    name: Heriot-Watt Canvas (Instructure)
    description: >-
      The university's virtual learning environment, an Instructure Canvas tenancy at
      canvas.hw.ac.uk (CNAME hwu-vanity.instructure.com). Canvas ships a documented REST API and
      LTI 1.3 platform role as product features; at Heriot-Watt the API is present but closed —
      GET /api/v1/accounts returns 401 with an unauthenticated error and requires an
      institutionally issued OAuth2 token. The contract, the LTI certification and the API
      documentation all belong to Instructure, so none of it is saved under this institution.
      Recorded as a tenant relationship.
    humanURL: https://canvas.hw.ac.uk/
    baseURL: https://canvas.hw.ac.uk/api/v1
    x-operator: tenant
    x-platform: Instructure Canvas
    x-vendor-host: hwu-vanity.instructure.com
    tags:
      - Learning Management
      - Canvas
      - LTI
      - Teaching
    properties:
      - type: Documentation
        url: https://canvas.hw.ac.uk/
  - aid: heriot-watt:libcal
    name: Heriot-Watt LibCal (Springshare)
    description: >-
      Springshare LibCal tenancy for library room bookings, events and opening hours at
      hw.ac.libcal.com (CNAME region-eu.libcal.com). LibCal's REST API exists at this host — the
      OAuth2 token endpoint /1.1/oauth/token answers 405 to a GET, confirming the route is
      routed and live — but it is gated behind an admin-provisioned OAuth client, so no
      unauthenticated call succeeds. The API contract is Springshare's and is not saved under
      this institution.
    humanURL: https://hw.ac.libcal.com/
    baseURL: https://hw.ac.libcal.com/1.1/
