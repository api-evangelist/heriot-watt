apis:
  - aid: heriot-watt:research-portal
    name: Heriot-Watt Research Portal (Pure)
    description: >-
      Public research information portal powered by Elsevier Pure, exposing Heriot-Watt
      University publications, projects, research data, activities, and researcher
      profiles. The portal is publicly browsable and searchable. Pure provides an
      OAI-PMH and REST API as platform features, but at this institution those
      programmatic endpoints are not openly available (the OAI/ws endpoints redirect
      to an error and require credentialed or arranged access).
    humanURL: https://researchportal.hw.ac.uk/
    baseURL: https://researchportal.hw.ac.uk/
    tags: [ Research, Repository, Pure, Open Access, Publications ]
    properties:
      - type: Documentation
        url: https://www.hw.ac.uk/uk/research/research-portal.htm
  - aid: heriot-watt:library-discovery
    name: Heriot-Watt Library Discovery (Ex Libris Primo / Alma)
    description: >-
      Library Discovery search across the catalogue, ebooks, journal articles, and
      news, delivered on the Ex Libris Alma library management platform with the
      Primo discovery interface. Ex Libris exposes Primo and Alma REST APIs as
      platform capabilities, but these require an Ex Libris API key and institutional
      arrangement and are not published as a self-service public API.
    humanURL: https://www.hw.ac.uk/about/professional-services/information-services/find-resources
    tags: [ Library, Discovery, Primo, Alma, Ex Libris, Catalog ]
    properties:
      - type: Documentation
        url: https://www.hw.ac.uk/about/professional-services/information-services/find-resources
  - aid: heriot-watt:libcal
    name: Heriot-Watt LibCal (Springshare)
    description: >-
      Springshare LibCal service for library room bookings, events, and opening hours.
      LibCal offers a documented REST API behind an admin-configured OAuth client; the
      API surface is reachable at the institution's LibCal host but requires
      authenticated credentials rather than open public access.
    humanURL: https://hw.ac.libcal.com/
    tags: [ Library, Bookings, Events, LibCal, Springshare ]
    properties:
      - type: Documentation
        url: https://hw.ac.libcal.com/
