aid: heriot-watt
name: Heriot-Watt University
x-type: university
x-category: Public Research University
description: >-
  Heriot-Watt University is a public research university based in Edinburgh, Scotland, with
  further campuses in the Scottish Borders, Orkney, Dubai and Malaysia, ROR 04mghma93. Its
  programmable footprint is small but — unusually for this cohort — not empty and not entirely
  rented. Two surfaces are genuinely institution-operated and openly callable without
  credentials: the Research Output Service (ROS) at www.ros.hw.ac.uk, a DSpace 8 deployment on
  the university's own domain with a live OAI-PMH 2.0 endpoint and an unauthenticated DSpace
  REST/HAL API over its theses and research outputs; and the university's SAML 2.0 identity
  provider, registered in the UK Access Management Federation as Heriot-Watt University, whose
  signed metadata is machine-readable through the federation's MDQ service. Everything else that
  looks like a Heriot-Watt API is a vendor platform the university rents under its own name and
  is recorded here as a tenant relationship, not as Heriot-Watt engineering: the research portal
  at researchportal.hw.ac.uk is Elsevier Pure (the host CNAMEs to hwu.elsevierpure.com), library
  discovery at discovery.hw.ac.uk is Ex Libris Primo, canvas.hw.ac.uk is Instructure Canvas, and
  hw.ac.libcal.com is Springshare LibCal. Heriot-Watt operates no central developer portal, no
  public API documentation, no open-data portal and no course-catalog or timetabling API; the
  programme search at hw.ac.uk is server-rendered HTML with no JSON backend, and
  timetable.hw.ac.uk, though on the university's own network, exposes no reachable public
  endpoint.
