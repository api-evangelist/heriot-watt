---
aid: heriot-watt
name: Heriot-Watt University
description: >-
  Heriot-Watt University is a public research university based in Edinburgh, Scotland,
  with additional campuses in the Scottish Borders, Orkney, Dubai, and Malaysia. It is
  ranked #257 in the QS World University Rankings 2025. Heriot-Watt's public, machine-readable
  footprint centers on its Research Portal (powered by Elsevier Pure) for research outputs,
  projects, and expertise, and on Ex Libris Alma/Primo library Discovery and Springshare
  LibCal services. The university does not operate a public developer portal; programmatic
  interfaces such as the Pure OAI-PMH/REST API and the LibCal API exist as platform features
  but are gated and require credentials or institutional arrangement rather than being openly
  self-service.
