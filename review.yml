    summary: >-
      Heriot-Watt University has no public developer portal and no official GitHub
      organization (the "HerriotWatt" org is an unrelated student course project).
      Verified live, publicly browsable platforms include the Research Portal (Elsevier
      Pure), Library Discovery (Ex Libris Alma/Primo), Springshare LibCal, and the
      system status page. The underlying platforms (Pure OAI-PMH/REST, Primo/Alma REST,
      LibCal REST) support APIs as features, but at this institution they are gated:
      the Pure /ws/oai endpoint redirects to an error and the others require credentials
      or an Ex Libris/Springshare API key. No public endpoints, base URLs, or schemas
      were fabricated; only URLs confirmed by live probing are listed below.
