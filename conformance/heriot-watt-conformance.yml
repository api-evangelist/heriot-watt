  - id: oneroster
    name: IMS OneRoster
    conforms: false
    evidence: No OneRoster endpoint or roster-exchange documentation found.
  - id: ed-fi
    name: Ed-Fi Data Standard
    conforms: false
    evidence: Ed-Fi is a US K-12 / state-longitudinal standard; not applicable to a Scottish HEI and no artifact found.
  - id: caliper
    name: IMS Caliper Analytics
    conforms: false
    evidence: No Caliper event store, sensor endpoint or documentation found.
  - id: qti
    name: IMS Question and Test Interoperability
    conforms: false
